name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.action != 'closed'
        uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: deployment-token
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list --name '${{ vars.STATIC_WEB_APP_NAME }}' --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' --query properties.apiKey -o tsv)
          test -n "$token"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - if: github.event.action != 'closed'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment-token.outputs.value }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: public
          skip_app_build: true

      - if: github.event.action == 'closed'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment-token.outputs.value }}
          action: close
